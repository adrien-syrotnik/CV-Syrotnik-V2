# Per-IP limits on the large downloads (zips, PDFs)
limit_conn_zone $binary_remote_addr zone=dl_conn:1m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Redirects stay relative (no internal host:8080 behind Traefik)
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA entry point: always revalidate
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Angular output files carry a content hash in their name
    location ~* "\.[0-9a-f]{16,20}\.(js|css|woff2?|ttf|eot|svg|png|jpg|gif)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Large downloads: 2 connections per IP, bandwidth capped after the first 5 MB
    location /assets/dl/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        limit_conn dl_conn 2;
        limit_rate_after 5m;
        limit_rate 2m;
        try_files $uri =404;
    }

    # Other static assets (images, i18n, downloads): moderate cache
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
